# Pontos de partida por área de tecnologia (docs da v2, seção 4). O formulário do Perfil e a IA usam
# estas listas como sugestão; o que vale é o que fica salvo no perfil.
#
#   titles_pt / titles_en  cargos para sugerir no perfil e montar as buscas
#   terms                  palavras da área para as buscas ("backend OR back-end")
#   hirers                 quem contrata, para as buscas de Pessoas no LinkedIn
#   title_filter           palavras do título que valem nos quadros das empresas-alvo
#   skills                 sugestões: core entra como essencial, tools como importante, extras como extra
#   wwr_feeds              feeds do We Work Remotely (categories/<feed>.rss)
#   niche_sources          fontes de nicho que fazem sentido para a área

backend:
  name: "Back-end"
  group: "Desenvolvimento"
  titles_pt: ["Desenvolvedor Back-end", "Engenheiro de Software Back-end"]
  titles_en: ["Backend Engineer", "Backend Developer", "Software Engineer"]
  terms: ["backend", "back-end", "back end"]
  hirers: ["Tech Recruiter", "Engineering Manager", "Tech Lead", "CTO"]
  title_filter: [engineer, developer, desenvolvedor, programador, software, backend, back-end, "back end"]
  skills:
    core: ["Ruby on Rails", "Python", "Django", "Java", "Spring", "Node.js", "Go", "PHP", "Laravel", "C#", ".NET", "Elixir", "Kotlin"]
    tools: ["PostgreSQL", "MySQL", "Redis", "Docker", "AWS", "REST", "GraphQL", "Kafka", "Sidekiq"]
    extras: ["Kubernetes", "Terraform", "RabbitMQ", "Elasticsearch", "CI/CD", "Microsserviços"]
  wwr_feeds: [remote-back-end-programming-jobs, remote-full-stack-programming-jobs]
  niche_sources: [backend_br, hacker_news]

