# O Radar lista só o que precisa ser feito à mão (o resto o WorkMachine busca sozinho),
# organizado por frequência. As buscas seguem as fórmulas das diretrizes de recolocação
# (cargo, stack e área combinados com termos de contratação) e são preenchidas com o perfil:
#
#   {{stack}}             a primeira skill essencial          {{stack_or}}       essenciais e sinônimos
#   {{importantes_or}}    skills importantes                  {{extras_or}}      skills extras
#   {{cargo}}             o primeiro cargo alvo               {{cargos_or}}      cargos em PT e EN
#   {{cargos_en_or}}      cargos em inglês                    {{area}}           nome da área
#   {{area_or}}           palavras da área (backend…)         {{quem_contrata_or}} quem contrata na área
#   {{senioridade_or}}    palavras do nível (pleno…)          {{plano_b_or}}     termos do plano B
#   {{dominios_or}}       setores de interesse                {{termos}}         termos de busca, em texto
#
# Uma busca com variável vazia no perfil não aparece. Cada busca tem uma "key" fixa: o perfil pode
# trocar a consulta de uma busca (Perfil → Buscas do Radar) sem mudar o resto.
#
# Cada busca tem um "builder", que monta a URL com os filtros escolhidos (Radar.url_for):
#   li_jobs        LinkedIn Vagas, com o local e o período escolhidos
#   li_jobs_world  LinkedIn Vagas, sempre em "Mundo · remoto"
#   li_posts       LinkedIn Publicações, com o período escolhido
#   li_people_br   LinkedIn Pessoas, filtrado para o Brasil
#   li_people      LinkedIn Pessoas, sem filtro de país
#   google         Google, com o período de indexação escolhido
#   google_jobs    painel Google Empregos (ignora o período)
#   x              X (Twitter), aba "Mais recentes"

# Fontes que o WorkMachine já consulta sozinho (resumo no topo do Radar, detalhes recolhidos).
# "sources" são as chaves gravadas em SourceRun; "app_link" aponta para uma tela do app.
automated:
  - { name: "Alertas do LinkedIn", sources: [linkedin_alert], url: "https://www.linkedin.com/jobs/alerts/", note: "E-mails de alerta lidos no Gmail. Crie e marque os alertas na seção Alertas do LinkedIn, em Uma vez." }
  - { name: "Respostas das empresas", sources: [application_replies], app_link: job_applications, note: "E-mails das empresas em que você aplicou, lidos no Gmail: recusa, entrevista, teste e proposta movem o cartão sozinhos." }
  - { name: "Empresas-alvo", sources: [greenhouse, lever, ashby, workable], app_link: target_companies, note: "Quadros Greenhouse, Lever, Ashby e Workable. Empresas novas entram sozinhas quando uma vaga aponta para o quadro delas." }
  - { name: "Remotive", sources: [remotive], url: "https://remotive.com/", note: "Buscas por {{termos}}, no máximo 4 vezes por dia, como pedem os termos da API." }
  - { name: "Remote OK", sources: [remote_ok], url: "https://remoteok.com/", note: "Vagas com {{termos}} no título ou nas tags." }
  - { name: "We Work Remotely", sources: [we_work_remotely], url: "https://weworkremotely.com/", note: "Feeds da sua área, filtrados por {{termos}}." }
  - { name: "Remotar", sources: [remotar], url: "https://remotar.com.br/", note: "Remotas para quem está no Brasil, buscas por {{termos}}." }
  - { name: "Gupy", sources: [gupy], url: "https://portal.gupy.io/", note: "Busca do portal da Gupy por {{termos}} no título das vagas de empresas brasileiras." }
  - { name: "Programathor", sources: [programathor], url: "https://programathor.com.br/jobs", note: "Páginas de cada tecnologia ({{termos}}); as vagas vencidas ficam de fora." }
  - { name: "Vagas.com", sources: [vagas_com], url: "https://www.vagas.com.br/", note: "Buscas por {{termos}}; mais vagas de empresas grandes e de cargos amplos." }
  - { name: "Canais do Telegram", sources: [telegram], url: "https://t.me/s/CafeinaVagas", note: "Canal Cafeína Vagas, para quem está começando: só roda com o perfil júnior. Grupos pedem login e continuam à mão." }
  - { name: "Himalayas", sources: [himalayas], url: "https://himalayas.app/", note: "Buscas por {{termos}}, com os países aceitos em cada vaga." }
  - { name: "Working Nomads", sources: [working_nomads], url: "https://www.workingnomads.com/", note: "Feed de remotas, quando o título ou as tags têm {{termos}}." }
  - { name: "GoRails Jobs", sources: [gorails], url: "https://jobs.gorails.com/", note: "Quadro da comunidade GoRails; todas as vagas são de Rails." }
  - { name: "backend-br/vagas", sources: [backend_br], url: "https://github.com/backend-br/vagas/issues", note: "Issues de back-end que citam {{termos}}." }
  - { name: "frontendbr/vagas", sources: [frontend_br], url: "https://github.com/frontendbr/vagas/issues", note: "Issues de front-end com {{termos}} ou com o seu plano B." }
  - { name: "Hacker News · Who is hiring", sources: [hacker_news], url: "https://news.ycombinator.com/submitted?id=whoishiring", note: "Comentários da thread do mês que citam {{termos}} e remote." }

filters:
  li_region:
    label: Local
    default: br_remote
    options:
      - { value: br_remote, label: "Brasil · remoto" }
      - { value: world_remote, label: "Mundo · remoto" }
      - { value: local, label: "Perto de você" }
      - { value: br_all, label: "Brasil · todos" }
  li_period:
    label: Publicadas
    default: r86400
    options:
      - { value: r86400, label: "24 h" }
      - { value: r604800, label: "7 dias" }
      - { value: r2592000, label: "30 dias" }
  post_period:
    label: Publicados
    default: past-24h
    options:
      - { value: past-24h, label: "24 h" }
      - { value: past-week, label: "Semana" }
      - { value: past-month, label: "Mês" }
  g_period:
    label: Indexadas
    default: w
    options:
      - { value: w, label: "Semana" }
      - { value: m, label: "Mês" }
      - { value: "", label: "Qualquer data" }

cadences:
  - { key: daily, title: "Todo dia", time: "~15 min, depois de triar as vagas novas" }
  - { key: weekly, title: "Toda semana", time: "~30 min, de preferência na segunda" }
  - { key: once, title: "Uma vez", time: "e revisar quando o perfil mudar" }

# Tarefas manuais. Cada uma pode ter: searches (com filters), links (only_for: só aparece quando o
# perfil tem o termo), link (um atalho), status (resumo de uma fonte automática), registrations
# (checklist de cadastros), collapsed (começa recolhida; toda tarefa recolhe pelo título) ou checkable (cada busca ganha a caixa "ativado", gravada pela consulta em
# ActivatedAlert: as marcadas vão para o fim e, se o perfil mudar a consulta, ela volta como nova).
# Textos e URLs aceitam as variáveis do perfil.
tasks:
  - key: feed
    cadence: daily
    title: "Publicações no LinkedIn"
    action: "Abra cada busca das últimas 24 h e mande mensagem direta para quem postou: recrutadores e gestores postam aqui antes de abrir a vaga."
    filters: [post_period]
    searches:
      - key: feed_contratando
        title: "Contratando (PT)"
        query: '{{stack}} AND (vaga OR contratando OR "estamos contratando")'
        builder: li_posts
      - key: feed_hiring
        title: "Hiring (EN)"
        query: '{{stack_or}} AND (hiring OR "we are hiring" OR "we''re hiring")'
        builder: li_posts
      - key: feed_looking_for
        title: "“Looking for”"
        query: '"looking for" AND {{cargos_en_or}}'
        builder: li_posts
      - key: feed_time_crescendo
        title: "Gestor com time crescendo"
        query: '("my team is hiring" OR "my team is growing" OR "meu time está crescendo") AND {{stack_or}}'
        builder: li_posts
      - key: feed_indicacao
        title: "Indicação / referral"
        query: '(indicação OR referral) AND {{stack_or}}'
        builder: li_posts
      - key: feed_area
        title: "Stack e área"
        query: '(vaga OR hiring) AND {{area_or}} AND {{stack_or}}'
        builder: li_posts
      - key: feed_remoto
        title: "Remoto para Brasil/LATAM"
        query: '{{stack_or}} AND (remoto OR remote) AND (LATAM OR Brasil OR Brazil)'
        builder: li_posts
      - key: feed_grupos
        title: "Links de grupos de vagas"
        note: "Para achar grupos de WhatsApp e Telegram."
        query: '("grupo de whatsapp" OR "link do grupo" OR "grupo do telegram") AND vagas AND (TI OR tech OR {{area}})'
        builder: li_posts

  - key: telegram
    cadence: daily
    title: "Grupos do Telegram"
    action: "Em cada grupo, use a busca interna com {{termos}}. O Telegram não tem alerta por palavra-chave."
    links:
      - { name: "Vagas TI Brasil", url: "https://t.me/vagastibr" }
      - { name: "Vagas Home Office Brasil", url: "https://t.me/vagashomeofficebr" }
      - { name: "Recrutei Empregos", url: "https://t.me/recrutei_empregos" }
      - { name: "Vagas UX/UI Brasil", url: "https://t.me/vagasuxui", only_for: "UX" }
    more: "Mais grupos: procure no Telegram por “Vagas” com o nome da sua stack ou da sua área, ou veja o diretório do Kombo."
    link: { label: "Diretório Kombo", url: "https://www2.kombo.com.br/grupos/" }

  - key: pessoas
    cadence: weekly
    collapsed: true
    title: "Recrutadores no LinkedIn"
    action: "Conecte com 5 por semana, com a nota de conexão de Mensagens, e salve cada um em Contatos pelo ícone da extensão, no perfil da pessoa. Muita vaga aparece primeiro no post de alguém do time."
    searches:
      - key: pessoas_recrutadores
        title: "Tech recruiters da sua stack (Brasil)"
        query: '("tech recruiter" OR "technical recruiter" OR recrutador) AND {{stack_or}}'
        builder: li_people_br
      - key: pessoas_talent
        title: "Talent acquisition (Brasil)"
        query: '"talent acquisition" AND {{stack_or}}'
        builder: li_people_br
      - key: pessoas_gestores
        title: "Quem contrata na sua área (Brasil)"
        query: '{{quem_contrata_or}} AND {{stack}}'
        builder: li_people_br
      - key: pessoas_consultorias
        title: "Recrutadores das consultorias tech"
        query: '(recruiter OR recrutador) AND (Yoctoo OR Hunter4Tech OR Rehva OR Huntz OR GeekHunter OR Intera)'
        builder: li_people
      - key: pessoas_internacionais
        title: "Recrutadores internacionais para LATAM"
        query: '("technical recruiter" OR "talent acquisition") AND (LATAM OR "Latin America") AND {{stack_or}}'
        builder: li_people

  - key: x
    cadence: weekly
    collapsed: true
    title: "Buscas no X"
    action: "Passe por 3 a 5 buscas na aba “Mais recentes”."
    searches:
      - key: x_vaga_pt
        title: "Vaga em português"
        query: '{{stack}} (vaga OR contratando OR "estamos contratando") -filter:replies'
        builder: x
      - key: x_hiring
        title: "Hiring remoto"
        query: '{{stack_or}} (hiring OR "we''re hiring" OR "join our team") remote -filter:replies'
        builder: x
      - key: x_titulo
        title: "Por cargo"
        query: '{{cargos_en_or}} hiring'
        builder: x
      - key: x_remoto_pt
        title: "Remoto em PT"
        query: '{{stack_or}} (vaga OR remoto) lang:pt -filter:replies'
        builder: x
      - key: x_area
        title: "Stack e área"
        query: '{{area_or}} {{stack_or}} (hiring OR vaga)'
        builder: x

  - key: google
    cadence: weekly
    collapsed: true
    title: "Google"
    action: "Rode com o filtro Semana. Achou vaga boa? Salve pela extensão: se ela estiver num Greenhouse, Lever, Ashby ou Workable, a empresa entra sozinha em Empresas-alvo."
    filters: [g_period]
    searches:
      - key: google_ats_br
        title: "InHire, Recrutei, Sólides"
        query: '(site:inhire.app OR site:jobs.recrutei.com.br OR site:vagas.solides.com.br) {{stack_or}}'
        builder: google
      - key: google_trabalhe_conosco
        title: "“Trabalhe conosco”"
        query: '"trabalhe conosco" {{stack}}'
        builder: google
      - key: google_jobs
        title: "Google Empregos"
        note: "Não usa o filtro de data."
        query: "vagas {{cargo}} remoto"
        builder: google_jobs
      - key: google_greenhouse
        title: "Empresas novas no Greenhouse"
        query: '(site:boards.greenhouse.io OR site:job-boards.greenhouse.io) {{stack}} (brazil OR brasil OR latam OR "latin america")'
        builder: google
      - key: google_lever
        title: "Empresas novas no Lever"
        query: 'site:jobs.lever.co {{stack_or}} (brazil OR latam OR "latin america")'
        builder: google
      - key: google_ashby
        title: "Empresas novas no Ashby"
        query: 'site:jobs.ashbyhq.com {{stack_or}} (brazil OR latam OR "latin america" OR americas)'
        builder: google
      - key: google_workable
        title: "Empresas novas no Workable"
        query: 'site:apply.workable.com {{stack}} (brazil OR brasil OR latam OR remote)'
        builder: google

  - key: sites
    cadence: weekly
    title: "Sites sem API"
    action: "Confira as vagas novas da semana. Os demais, só se sobrar tempo."
    links:
      - { name: "GeekHunter", url: "https://www.geekhunter.com.br/vagas" }
      - { name: "Indeed Brasil", url: "https://br.indeed.com/jobs?q={{cargo}}" }
      - { name: "Glassdoor", url: "https://www.glassdoor.com/" }
      - { name: "Jooble", url: "https://br.jooble.org/" }
      - { name: "Wellfound", url: "https://wellfound.com/jobs", note: "startups" }
      - { name: "Ruby on Remote", url: "https://rubyonremote.com/", note: "filtros “Remote – South America” e “Remote – Anywhere”", only_for: "Ruby on Rails" }
      - { name: "RubyEvents · Brasil", url: "https://www.rubyevents.org/events/countries/brazil", note: "meetups e Tropical on Rails", only_for: "Ruby on Rails" }
      - { name: "Fórum do Rails", url: "https://discuss.rubyonrails.org/", only_for: "Ruby on Rails" }

  - key: linkedin_alerts
    cadence: once
    title: "Alertas do LinkedIn"
    action: "Abra cada busca, ligue “Alerta de vaga” (por e-mail, diário) e marque aqui como ativado. O WorkMachine lê os alertas no Gmail a cada hora; quando o perfil mudar, as buscas novas aparecem aqui."
    status: linkedin_alert
    checkable: true
    filters: [li_region, li_period]
    searches:
      - key: alert_cargos
        title: "Cargos alvo"
        query: '{{cargos_or}}'
        builder: li_jobs
      - key: alert_skills
        title: "Stack e skills importantes"
        query: '{{stack_or}} AND {{importantes_or}}'
        builder: li_jobs
      - key: alert_nivel
        title: "No seu nível"
        query: '{{stack_or}} AND {{senioridade_or}}'
        builder: li_jobs
      - key: alert_area
        title: "Stack e área"
        query: '{{stack_or}} AND {{area_or}}'
        builder: li_jobs
      - key: alert_diferenciais
        title: "Seus diferenciais"
        query: '{{stack}} AND {{extras_or}}'
        builder: li_jobs
      - key: alert_setores
        title: "Setores de interesse"
        query: '{{stack_or}} AND {{dominios_or}}'
        builder: li_jobs
      - key: alert_plano_b
        title: "Plano B"
        query: '{{plano_b_or}} AND {{senioridade_or}}'
        builder: li_jobs
      - key: alert_internacional
        title: "Internacional para LATAM"
        note: "Sempre em Mundo · remoto."
        query: '{{stack_or}} AND (LATAM OR "Latin America" OR Brazil)'
        builder: li_jobs_world

  - key: cadastros
    cadence: once
    title: "Cadastros"
    action: "Crie o perfil uma vez e marque aqui. Consultorias puxam candidatos do próprio banco quando abre um processo; pule as de executive search, que são para diretoria."
    registrations: true
