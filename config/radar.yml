# O Radar lista só o que precisa ser feito à mão (o resto o WorkMachine busca sozinho),
# organizado por frequência. Buscas e lugares vieram de docs/radar-vagas-rails.html.
# Cada busca tem um "builder", que monta a URL com os filtros escolhidos (Radar.url_for):
#   li_jobs        LinkedIn Vagas, com o local e o período escolhidos
#   li_jobs_world  LinkedIn Vagas, sempre em "Mundo · remoto"
#   li_posts       LinkedIn Publicações, com o período escolhido
#   li_people_br   LinkedIn Pessoas, filtrado para o Brasil
#   li_people      LinkedIn Pessoas, sem filtro de país
#   google         Google, com o período de indexação escolhido
#   google_jobs    painel Google Empregos (ignora o período)
#   x              X (Twitter), aba "Mais recentes"

# Fontes que o WorkMachine já consulta sozinho (resumo no topo do Radar, detalhes recolhidos).
# "sources" são as chaves gravadas em SourceRun; "app_link" aponta para uma tela do app.
automated:
  - { name: "Alertas do LinkedIn", sources: [linkedin_alert], url: "https://www.linkedin.com/jobs/alerts/", note: "E-mails de alerta lidos no Gmail. Crie os alertas pelas buscas da seção LinkedIn · Vagas." }
  - { name: "Respostas das empresas", sources: [application_replies], app_link: job_applications, note: "E-mails das empresas em que você aplicou, lidos no Gmail: recusa, entrevista, teste e proposta movem o cartão sozinhos." }
  - { name: "Empresas-alvo", sources: [greenhouse, lever, ashby, workable], app_link: target_companies, note: "Quadros Greenhouse, Lever, Ashby e Workable. Empresas novas entram sozinhas quando uma vaga aponta para o quadro delas." }
  - { name: "Remotive", sources: [remotive], url: "https://remotive.com/", note: "Buscas “rails” e “ruby”, no máximo 4 vezes por dia, como pedem os termos da API." }
  - { name: "Remote OK", sources: [remote_ok], url: "https://remoteok.com/", note: "Vagas com as tags ruby e rails." }
  - { name: "We Work Remotely", sources: [we_work_remotely], url: "https://weworkremotely.com/", note: "Feeds de full stack e back-end, filtrados por ruby e rails." }
  - { name: "Remotar", sources: [remotar], url: "https://remotar.com.br/", note: "Remotas para quem está no Brasil, buscas “ruby” e “rails”." }
  - { name: "Himalayas", sources: [himalayas], url: "https://himalayas.app/", note: "Busca “ruby on rails”, com os países aceitos em cada vaga." }
  - { name: "Working Nomads", sources: [working_nomads], url: "https://www.workingnomads.com/", note: "Feed de remotas, quando o título ou as tags falam de Ruby ou Rails." }
  - { name: "GoRails Jobs", sources: [gorails], url: "https://jobs.gorails.com/", note: "Quadro da comunidade GoRails; todas as vagas são de Rails." }
  - { name: "backend-br/vagas", sources: [backend_br], url: "https://github.com/backend-br/vagas/issues", note: "Issues que falam de Ruby ou Rails." }
  - { name: "frontendbr/vagas", sources: [frontend_br], url: "https://github.com/frontendbr/vagas/issues", note: "Plano B: React com TypeScript ou Next.js." }
  - { name: "Hacker News · Who is hiring", sources: [hacker_news], url: "https://news.ycombinator.com/submitted?id=whoishiring", note: "Comentários da thread do mês que citam Rails e remote." }

# Termos para preencher perfis em plataformas e consultorias (seção Cadastros).
profile_keywords:
  titles: ["Desenvolvedor Ruby on Rails", "Desenvolvedor Full Stack Ruby", "Ruby on Rails Developer",
           "Full Stack Engineer (Rails/React)", "Product Engineer", "Software Engineer II"]
  skills: ["Rails 8", "Hotwire / Turbo", "Sidekiq", "Solid Queue", "multi-tenant", "PostgreSQL", "RSpec",
           "upgrade de Rails", "Docker", "Kubernetes", "GitHub Actions", "pagamentos", "LGPD", "GovTech", "WCAG"]
  plan_b: ["Front-end Engineer React", "Next.js / TypeScript"]

filters:
  li_region:
    label: Local
    default: br_remote
    options:
      - { value: br_remote, label: "Brasil · remoto" }
      - { value: world_remote, label: "Mundo · remoto" }
      - { value: rs, label: "Paraná" }
      - { value: br_all, label: "Brasil · todos" }
  li_period:
    label: Publicadas
    default: r86400
    options:
      - { value: r86400, label: "24 h" }
      - { value: r604800, label: "7 dias" }
      - { value: r2592000, label: "30 dias" }
  post_period:
    label: Publicados
    default: past-24h
    options:
      - { value: past-24h, label: "24 h" }
      - { value: past-week, label: "Semana" }
      - { value: past-month, label: "Mês" }
  g_period:
    label: Indexadas
    default: w
    options:
      - { value: w, label: "Semana" }
      - { value: m, label: "Mês" }
      - { value: "", label: "Qualquer data" }

cadences:
  - { key: daily, title: "Todo dia", time: "~15 min, depois de triar as vagas novas" }
  - { key: weekly, title: "Toda semana", time: "~30 min, de preferência na segunda" }
  - { key: once, title: "Uma vez", time: "e revisar quando o CV mudar" }

# Tarefas manuais. Cada uma pode ter: searches (com filters), links, link (um atalho),
# status (resumo de uma fonte automática) ou registrations (checklist de cadastros).
tasks:
  - key: feed
    cadence: daily
    title: "Publicações no LinkedIn"
    action: "Abra cada busca das últimas 24 h e mande mensagem direta para quem postou: recrutadores e gestores postam aqui antes de abrir a vaga."
    filters: [post_period]
    searches:
      - title: "Contratando (PT)"
        query: '"ruby on rails" AND (vaga OR contratando OR "estamos contratando")'
        builder: li_posts
      - title: "Hiring (EN)"
        query: '(rails OR ruby) AND (hiring OR "we are hiring" OR "we''re hiring")'
        builder: li_posts
      - title: "“Looking for”"
        query: '"looking for" AND ("rails developer" OR "ruby developer" OR "rails engineer")'
        builder: li_posts
      - title: "Gestor com time crescendo"
        query: '("my team is hiring" OR "my team is growing" OR "meu time está crescendo") AND (rails OR ruby)'
        builder: li_posts
      - title: "Indicação / referral"
        query: '(indicação OR referral) AND ("ruby on rails" OR rails)'
        builder: li_posts
      - title: "Full stack Rails + React"
        query: '(vaga OR hiring) AND "full stack" AND rails AND react'
        builder: li_posts
      - title: "Remoto para Brasil/LATAM"
        query: '(rails OR ruby) AND (remoto OR remote) AND (LATAM OR Brasil OR Brazil)'
        builder: li_posts
      - title: "Links de grupos de vagas"
        note: "Para achar grupos de WhatsApp e Telegram."
        query: '("grupo de whatsapp" OR "link do grupo" OR "grupo do telegram") AND vagas AND (desenvolvedor OR dev OR TI)'
        builder: li_posts

  - key: telegram
    cadence: daily
    title: "Grupos do Telegram"
    action: "Em cada grupo, use a busca interna com “rails”, “ruby” e “full stack”. O Telegram não tem alerta por palavra-chave."
    links:
      - { name: "Vagas TI Brasil", url: "https://t.me/vagastibr" }
      - { name: "Vagas Tech Remotas", url: "https://t.me/vagastechrn" }
      - { name: "Vagas Home Office Brasil", url: "https://t.me/vagashomeofficebr" }
      - { name: "Recrutei Empregos", url: "https://t.me/recrutei_empregos" }
      - { name: "Cafeína Vagas", url: "https://t.me/CafeinaVagas" }
    more: "Mais grupos: procure no Telegram por “Vagas Ruby”, “Ruby on Rails Brasil”, “Vagas Back-end” ou veja o diretório do Kombo."
    link: { label: "Diretório Kombo", url: "https://www2.kombo.com.br/grupos/" }

  - key: pessoas
    cadence: weekly
    title: "Recrutadores no LinkedIn"
    action: "Conecte com 5 por semana, com a nota de conexão de Mensagens. Muita vaga aparece primeiro no post de alguém do time."
    searches:
      - title: "Tech recruiters de Rails (Brasil)"
        query: '("tech recruiter" OR "technical recruiter" OR recrutador) AND (ruby OR rails)'
        builder: li_people_br
      - title: "Talent acquisition (Brasil)"
        query: '"talent acquisition" AND ("ruby on rails" OR rails)'
        builder: li_people_br
      - title: "Gestores de times Rails (Brasil)"
        query: '("engineering manager" OR "tech lead" OR CTO) AND "ruby on rails"'
        builder: li_people_br
      - title: "Recrutadores das consultorias tech"
        query: '(recruiter OR recrutador) AND (Yoctoo OR Hunter4Tech OR Rehva OR Huntz OR GeekHunter OR Intera)'
        builder: li_people
      - title: "Recrutadores internacionais para LATAM"
        query: '("technical recruiter" OR "talent acquisition") AND (LATAM OR "Latin America") AND (ruby OR rails)'
        builder: li_people
    link: { label: "Planilha de recrutadores da mentora (colunas Ruby, React e Full Stack)", url: "https://docs.google.com/spreadsheets/d/1Geg0ETL00kLKzdaIGPudXe2IIMjqII8T92N9YAuXFe4/edit?usp=sharing" }

  - key: x
    cadence: weekly
    title: "Buscas no X"
    action: "Passe por 3 a 5 buscas na aba “Mais recentes”."
    searches:
      - title: "Vaga em português"
        query: '"ruby on rails" (vaga OR contratando OR "estamos contratando") -filter:replies'
        builder: x
      - title: "Hiring remoto"
        query: '(rails OR "ruby on rails") (hiring OR "we''re hiring" OR "join our team") remote -filter:replies'
        builder: x
      - title: "Por título"
        query: '("rails developer" OR "rails engineer" OR "ruby engineer") hiring'
        builder: x
      - title: "Remoto em PT"
        query: '(ruby OR rails) (vaga OR remoto) lang:pt -filter:replies'
        builder: x
      - title: "Full stack Rails + React"
        query: '"full stack" rails react (hiring OR vaga)'
        builder: x

  - key: google
    cadence: weekly
    title: "Google"
    action: "Rode com o filtro Semana. Achou vaga boa? Salve pela extensão: se ela estiver num Greenhouse, Lever, Ashby ou Workable, a empresa entra sozinha em Empresas-alvo."
    filters: [g_period]
    searches:
      - title: "Gupy"
        query: 'site:gupy.io ("ruby on rails" OR "ruby")'
        builder: google
      - title: "InHire, Recrutei, Sólides"
        query: '(site:inhire.app OR site:jobs.recrutei.com.br OR site:vagas.solides.com.br) ("ruby on rails" OR ruby)'
        builder: google
      - title: "“Trabalhe conosco”"
        query: '"trabalhe conosco" "ruby on rails"'
        builder: google
      - title: "Google Empregos"
        note: "Não usa o filtro de data."
        query: "vagas ruby on rails remoto"
        builder: google_jobs
      - title: "Empresas novas no Greenhouse"
        query: '(site:boards.greenhouse.io OR site:job-boards.greenhouse.io) "ruby on rails" (brazil OR brasil OR latam OR "latin america")'
        builder: google
      - title: "Empresas novas no Lever"
        query: 'site:jobs.lever.co ("ruby on rails" OR rails) (brazil OR latam OR "latin america")'
        builder: google
      - title: "Empresas novas no Ashby"
        query: 'site:jobs.ashbyhq.com ("ruby on rails" OR rails) (brazil OR latam OR "latin america" OR americas)'
        builder: google
      - title: "Empresas novas no Workable"
        query: 'site:apply.workable.com "ruby on rails" (brazil OR brasil OR latam OR remote)'
        builder: google

  - key: sites
    cadence: weekly
    title: "Sites sem API"
    action: "Confira as vagas novas da semana. Os demais, só se sobrar tempo."
    links:
      - { name: "Ruby on Remote", url: "https://rubyonremote.com/", note: "filtros “Remote – South America” e “Remote – Anywhere”" }
      - { name: "Programathor · Rails", url: "https://programathor.com.br/jobs-ruby-on-rails" }
      - { name: "Indeed Brasil", url: "https://br.indeed.com/q-ruby-on-rails-vagas.html" }
      - { name: "Glassdoor", url: "https://www.glassdoor.com/" }
      - { name: "Jooble", url: "https://br.jooble.org/" }
      - { name: "Vagas.com", url: "https://www.vagas.com.br/" }
      - { name: "RubyEvents · Brasil", url: "https://www.rubyevents.org/events/countries/brazil", note: "meetups e Tropical on Rails" }
      - { name: "Fórum do Rails", url: "https://discuss.rubyonrails.org/" }

  - key: linkedin_alerts
    cadence: once
    title: "Alertas do LinkedIn"
    action: "Abra cada busca e ligue “Alerta de vaga”, por e-mail e diário. O WorkMachine lê os alertas no Gmail a cada hora."
    status: linkedin_alert
    filters: [li_region, li_period]
    searches:
      - title: "Rails, geral"
        query: '"ruby on rails" OR "rails developer" OR "ruby developer" OR "desenvolvedor ruby"'
        builder: li_jobs
      - title: "Full stack Rails + React"
        query: '("ruby on rails" OR rails) AND (react OR "full stack" OR fullstack)'
        builder: li_jobs
      - title: "Pleno / mid-level"
        query: '("ruby on rails" OR ruby) AND (pleno OR "mid-level" OR "mid level")'
        builder: li_jobs
      - title: "Back-end Ruby"
        query: '(ruby OR rails) AND (backend OR "back-end" OR "back end")'
        builder: li_jobs
      - title: "Seus diferenciais"
        query: 'rails AND (hotwire OR sidekiq OR "rails 8" OR "multi-tenant")'
        builder: li_jobs
      - title: "GovTech / setor público"
        query: '(rails OR ruby OR "full stack") AND (govtech OR "setor público" OR "gestão pública")'
        builder: li_jobs
      - title: "Plano B: front React"
        query: '(react OR "next.js") AND typescript AND (pleno OR "mid-level")'
        builder: li_jobs
      - title: "Internacional para LATAM"
        note: "Sempre em Mundo · remoto."
        query: '("ruby on rails" OR rails) AND (LATAM OR "Latin America" OR Brazil)'
        builder: li_jobs_world

  - key: cadastros
    cadence: once
    title: "Cadastros"
    action: "Crie o perfil uma vez e marque aqui. Consultorias puxam candidatos do próprio banco quando abre um processo; pule as de executive search, que são para diretoria."
    registrations: true
