# Recurring jobs run by Solid Queue (inside Puma with SOLID_QUEUE_IN_PUMA=1).
# Times are in America/Sao_Paulo, whatever the container's time zone is.

default: &default
  fetch_jobs:
    class: FetchJobsJob
    schedule: every 3 hours
  follow_up_reminder:
    class: FollowUpReminderJob
    schedule: every day at 8am America/Sao_Paulo
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

development:
  <<: *default

production:
  <<: *default
