# Recurring jobs run by Solid Queue (inside Puma with SOLID_QUEUE_IN_PUMA=1).
# The follow-up reminder runs every hour and acts at 8am in the time zone of the profile.

default: &default
  fetch_jobs:
    class: FetchJobsJob
    schedule: every 3 hours
  import_linkedin_alerts:
    class: ImportLinkedinAlertsJob
    schedule: every hour
  import_application_replies:
    class: ImportApplicationRepliesJob
    schedule: every hour at minute 10
  database_backup:
    class: DatabaseBackupJob
    schedule: every hour at minute 30
  follow_up_reminder:
    class: FollowUpReminderJob
    schedule: every hour at minute 0
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

development:
  <<: *default

production:
  <<: *default
