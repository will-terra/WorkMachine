# Rotina diária e semanal (docs/radar-vagas-rails.html, seção Rotina), ajustada ao que o app já automatiza.
# Itens de slots "weekly: true" ficam marcados a semana toda; os outros recomeçam a cada dia.
# Não troque as chaves (key) de itens já usados: elas ficam gravadas em RoutineCheck.

slots:
  - title: "Manhã"
    time: "~15 min"
    items:
      - { key: m1, label: "Triar as vagas novas no WorkMachine (alertas do LinkedIn e agregador): salvar ou descartar" }
      - { key: m2, label: "Aplicar nas que têm aderência real (Analisar com IA e Resumo de CV ajudam)" }
      - { key: m3, label: "Mover no kanban as candidaturas que andaram (aplicada, entrevista, recusa…)" }
  - title: "Depois do almoço"
    time: "~20 min"
    items:
      - { key: a1, label: "LinkedIn Publicações no Radar: contratando, hiring e looking for (24 h)" }
      - { key: a2, label: "Mandar mensagem direta para quem postou (modelos em Mensagens)" }
      - { key: a3, label: "X: 2 ou 3 buscas em “Mais recentes”" }
  - title: "Fim do dia"
    time: "~10 min"
    items:
      - { key: e1, label: "Grupos do Telegram: buscar “rails” e “ruby” em cada um" }
      - { key: e2, label: "Revisar posts recentes sobre a stack e comentar em 1 ou 2" }
      - { key: e3, label: "Cobrar os follow-ups do Painel (o app marca quem está há mais de 5 dias sem resposta)" }
  - title: "Uma vez por semana"
    time: "segunda"
    weekly: true
    items:
      - { key: w1, label: "Google nos ATS (filtro Semana) e cadastrar as empresas boas em Empresas-alvo" }
      - { key: w2, label: "Ruby on Remote, Programathor e Remotar (o resto já é automático)" }
      - { key: w3, label: "Conectar com 5 recrutadores da planilha (Ruby, React, Full Stack)" }
      - { key: w4, label: "Radar → Automático: conferir se alguma fonte falhou e se os alertas do LinkedIn estão chegando" }

rules:
  - { title: "Aderência antes de volume.", text: "Aplique onde a stack bate de verdade e invista energia nessas." }
  - { title: "Puxe a conversa para o privado.", text: "Fale direto com quem postou a vaga." }
  - { title: "Tudo passa pelas candidaturas:", text: "salve pela triagem ou pela extensão (a candidatura já nasce com empresa, vaga, origem e link) e mantenha status e contato em dia." }
  - { title: "Pretensão em faixa, nunca número único.", text: "Antes, analise de 10 a 20 vagas parecidas e consulte Glassdoor, Revelo, Levels.fyi e Indeed. Para vaga em dólar, refaça a conta." }
