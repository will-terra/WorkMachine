      invalid_key: The OpenRouter key is invalid. Check it in Settings → Keys and accounts.
      no_credits: No credits on OpenRouter. Add credits at openrouter.ai/settings/credits or use the free model (Settings → Keys and accounts).
      free_limit: The free models hit their usage limit for now (per minute or per day). Try again later or switch to the paid model in Settings.
      limit: OpenRouter usage limit reached. Try again in a few minutes.
      data_policy: "OpenRouter refused because of your data policy: for the free models, allow them at openrouter.ai/settings/privacy or use the paid model."
      other: "OpenRouter error: %{message}"
      offline: No connection to OpenRouter (%{error}).
      refused: The AI refused the request.
      no_draft: The AI didn't return a draft. Try again.
      truncated: "[answer cut at the token limit]"
