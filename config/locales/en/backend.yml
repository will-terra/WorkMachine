en:
  cv_text:
    unsupported: Upload the CV as PDF, DOCX or TXT.
    empty: I found no text in the file. If the PDF is a scanned image, export it again as text.
    pdf: I couldn't read the PDF (%{message}).
    not_docx: The file doesn't look like a Word .docx.
    docx: I couldn't open the .docx (%{message}).
  http_client:
    invalid_json: "Invalid JSON at %{url}: %{message}"
  database_backup:
    failed: the SQLite copy failed
    busy: the database stayed busy for too long
  ai:
