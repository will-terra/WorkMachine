en:
  cv_text:
    unsupported: Upload the CV as PDF, DOCX or TXT.
    empty: I found no text in the file. If the PDF is a scanned image, export it again as text.
    pdf: I couldn't read the PDF (%{message}).
    not_docx: The file doesn't look like a Word .docx.
    docx: I couldn't open the .docx (%{message}).
  http_client:
    invalid_json: "Invalid JSON at %{url}: %{message}"
  database_backup:
    failed: the SQLite copy failed
    busy: the database stayed busy for too long
  ai:
    errors:
      invalid_key: The OpenRouter key is invalid. Check it in Settings → Keys and accounts.
      no_credits: No credits on OpenRouter. Add credits at openrouter.ai/settings/credits or use the free model (Settings → Keys and accounts).
      free_limit: The free models hit their usage limit for now (per minute or per day). Try again later or switch to the paid model in Settings.
      limit: OpenRouter usage limit reached. Try again in a few minutes.
      data_policy: "OpenRouter refused because of your data policy: for the free models, allow them at openrouter.ai/settings/privacy or use the paid model."
      other: "OpenRouter error: %{message}"
      offline: No connection to OpenRouter (%{error}).
      refused: The AI refused the request.
      no_draft: The AI didn't return a draft. Try again.
      truncated: "[answer cut at the token limit]"
  gmail:
    app_password_required: "Google requires an app password: use the 16 letters created at myaccount.google.com/apppasswords, not the account password."
    login_refused: Gmail refused the login (%{message}). Check the email and the app password in Settings.
  notifications:
    new_posting: New job scoring %{score}
    new_postings: "%{count} new jobs scoring %{score}+"
    more: and %{count} more
    follow_up_one: "Follow-up today: %{company}"
    follow_up_many: "%{count} follow-ups for today"
    interview_tomorrow: "Interview tomorrow: %{company}"
    interview_today: "Interview today: %{company}"
    interview_body: "%{time} · %{role}. The preparation is in the app."
    follow_up_body: "No reply for %{days}+ days: %{names}. The follow-up message comes filled in."
    replies:
      rejection: rejection
      interview: interview invitation
      assessment: test
      offer: offer
      recruiter_contact: message from the recruiter
  job_posting:
    no_company: Company not stated
  activerecord:
    errors:
      models:
        routine_item:
          attributes:
            url:
              invalid: must start with / (a screen of the app) or https://
  weekly_summary:
    title: Weekly summary
    heading: This week
    applied:
      one: 1 application
      other: "%{count} applications"
    last_week: "last week: %{count}"
    answers:
      one: 1 reply
      other: "%{count} replies"
    interviews:
      one: 1 interview invitation
      other: "%{count} interview invitations"
    rate: "Reply rate over 30 days: %{rate}%"
    sources: "Sources that paid off most: %{sources}"
    tip: "Tip: %{tip}"
    tips:
      none_applied:
        one: No applications this week. How about half an hour tomorrow for the saved job waiting for you?
        other: No applications this week. How about half an hour tomorrow for the %{count} saved jobs?
      none_applied_none_saved: No applications this week. Start with the new jobs with the highest score.
      follow_ups:
        one: "1 follow-up due: a short message often reopens the conversation."
        other: "%{count} follow-ups due: a short message often reopens the conversation."
      best_origin: Applications via %{origin} get %{rate}% replies (your average is %{average}%). Worth prioritizing.
      low_rate: "Few replies this month: try the tailored CV and ask for referrals from people you know at the companies."
      triage: There are %{count} new jobs waiting for triage.
      keep_going: Good pace. Keep the routine and send the follow-ups on the right day.
