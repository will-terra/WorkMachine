<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="optionsTitle">WorkMachine · Options</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="options">
  <header>
    <img src="icons/ruby-64.png" alt="" width="26" height="26">
    <span class="brand">WorkMachine</span>
    <span class="badge">on Rails</span>
  </header>
  <p class="eyebrow" data-i18n="browserExtension">browser extension</p>
  <h1 data-i18n="options">Options</h1>
  <p class="muted" data-i18n="optionsIntro">Connect the extension to the WorkMachine running on your computer.</p>
  <form id="options-form">
    <label><span data-i18n="serverLabel">WorkMachine address</span>
      <input name="server" placeholder="http://localhost:3000" required>
    </label>
    <label><span data-i18n="tokenLabel">API token</span>
      <input name="token" type="password" autocomplete="off" required>
      <span class="muted small" data-i18n="tokenHelp">Copy it in WorkMachine under Settings → Browser extension (or use the WORKMACHINE_API_TOKEN value from .env).</span>
    </label>
    <div class="row">
      <button type="submit" class="primary" data-i18n="save">Save</button>
      <button type="button" id="test" data-i18n="testConnection">Test connection</button>
    </div>
  </form>
  <p id="message" role="status"></p>
  <p class="muted small note" data-i18n="privacyNote">The extension only reads the page when you click its icon, and only talks to localhost:3000 or 127.0.0.1:3000.</p>
  <script type="module" src="options.js"></script>
</body>
</html>
